v1.8 方案存档；已确认 1:B、3:原版、4:5 线条猫
基线：../v1.7/留白-v1.7-定稿.html（最新定稿）。
修改项：完成后加时三方案对比：方案 A 延长本轮、方案 B 独立加时、原版覆盖时长。
已确认事项：沿用 v1.7 定稿全部产品行为，包括 1:C、3:C2、5:H 与默认自动外观。
待确认事项：第 1、3 项最终方案未确认，默认预览方案 A；切换不代表确认。
第 4 项：原版沿用第 3 项；2／5／8 为已选猫图标的 SVG 重绘。选择图标方案时覆盖第 3 项空闲显示：无运行任务菜单栏显示图标、无进度条、胶囊隐藏；有运行任务保持倒计时与进度。定稿删除 idleIcon 对比状态、存储和未采用图标。
第 3 项：A 菜单栏与胶囊均显示「✓ 已完成」；B 仅将菜单栏改为「✓ 00:00」，胶囊沿用 A；原版完成后胶囊隐藏、菜单栏显示留白。
运行任务优先；无运行任务时显示最近完成任务。完成态胶囊展开显示任务名，点击打开面板。旧数据缺少完成时间时按任务顺序回退。
定稿需删除 completionDisplay 选择存储、对比控件及未采用分支；保留已确认显示规则和完成时间记录。
A/B 保留 originalTotal，重置和完成后重新开始均恢复原始时长；B 每次完成后进入新加时阶段。
定稿清理：删除所有 DRAFT_ONLY 标记块、方案选择存储、测试按钮样式/模板/事件分支及未采用方案；保留已选方案真实加时行为。
第 2 项为全屏／非全屏场景模拟，仅控制预览显示，不属于产品设置；全屏收起面板，有运行任务时显示胶囊，非全屏恢复面板；定稿删除场景选项、previewScene 状态和处理逻辑，恢复实际全屏检测。
测试按钮和任务选择器仅放在左侧交互方案区，走正常到时处理，不改任务原始时长；定稿一并删除。
状态：未定稿；未进入本版原生实现或验收。
