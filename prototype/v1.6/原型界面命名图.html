<script>
const rows=JSON.parse(document.getElementById('naming-data').textContent), frame=document.getElementById('prototype'), message=document.getElementById('message');
function render(){const q=document.getElementById('search').value.toLowerCase();const list=document.getElementById('items');list.replaceChildren();for(const r of rows.filter(r=>[r.id,r.name,r.note].join(' ').toLowerCase().includes(q))){const b=document.createElement('button');b.id='ref-'+r.id;b.textContent=r.id+' · '+r.name;b.setAttribute('aria-pressed',String(location.hash==='#ref-'+r.id));const note=document.createElement('small');note.textContent=r.status+' · '+r.note;b.append(note);b.onclick=()=>{history.replaceState(null,'','#ref-'+r.id);locate(r);render()};list.append(b)}}
function locate(r){if(!r.selector){message.textContent=r.id+' '+r.name+'：'+r.note;return}try{const d=frame.contentDocument;if(!d?.body)throw Error('unavailable');d.querySelectorAll('[data-map-highlight]').forEach(e=>e.removeAttribute('data-map-highlight'));if(r.id.startsWith('E'))d.getElementById('settingsOpen')?.click();else if(r.id.startsWith('D')){if(!d.querySelector('.draft'))d.getElementById('add')?.click()}else if(r.id.startsWith('C')&&r.selector.includes('colorDialog'))d.querySelector('[data-color-edit]')?.click();let el=d.querySelector(r.selector);if(!el||!el.getClientRects().length){message.textContent=r.id+' '+r.name+'：当前状态尚未显示，请先在右侧触发该界面。定位：'+r.selector;return}el.setAttribute('data-map-highlight','');el.scrollIntoView({block:'nearest'});message.textContent=r.id+' '+r.name+'：'+r.note}catch{message.textContent='浏览器不允许读取此文件嵌入页面，自动高亮不可用。可独立打开定稿，按名称表中的编号和选择器查看。'}}
frame.onload=()=>{try{const d=frame.contentDocument;if(!d?.head)throw Error();const style=d.createElement('style');style.textContent='[data-map-highlight]{outline:3px solid #ef8b31!important;outline-offset:3px!important}';d.head.append(style);message.textContent='已加载同目录定稿。橙色边框仅为命名图定位标记，不属于产品。';const r=rows.find(r=>'#ref-'+r.id===location.hash);if(r)locate(r)}catch{message.textContent='已请求显示定稿；浏览器限制文件间访问，自动高亮不可用。请使用名称表或独立打开定稿。'}};
document.getElementById('search').oninput=render;render();
</script></body></html>
